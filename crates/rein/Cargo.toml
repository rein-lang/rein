[package]
name = "rein"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "CLI, language server and MCP server for Rein, a language for agent processes."

[dependencies]
rein-core = { path = "../rein-core", version = "0.1.6" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
form_urlencoded = "1"
lsp-server = "0.7"
lsp-types = "0.95"
clap-markdown = "0.1.5"
polyhook = "0.2.0"
rmcp = { version = "3.9.0", default-features = false, features = ["server", "transport-io", "macros"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt"] }
serde = { version = "1.0.229", features = ["derive"] }
schemars = "1"
glob = "0.3"
open = "5"

[dev-dependencies]
insta = "1"

[lints]
workspace = true
