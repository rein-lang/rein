<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rein debug</title>
<script>
  // Sets the saved theme before first paint, so a dark choice does not flash light.
  try { const t = localStorage.getItem("rein-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
  /* Colors are tokens. The OS sets the dark set unless data-theme says light. */
  :root {
    color-scheme: light;
    --bg: #fff; --fg: #111; --muted: #666; --line: #ddd; --field-bg: #fff;
    --ok: #15803d; --on-ok: #fff; --ok-bg: #dcfce7; --ok-line: #16a34a;
    --hot: #d97706; --hot-bg: #fde68a;
    --wait-bg: #fef3c7; --error-bg: #fee2e2; --needed-bg: #fffbeb;
    --unresolved: #c00;
    --dim-fill: #f3f4f6; --dim-line: #9ca3af; --dim-text: #374151;
    --edge-bg: #e8e8e8; --edge-text: #333;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0f1115; --fg: #e5e7eb; --muted: #a3a3a3; --line: #3f3f46; --field-bg: #1c1f26;
      --ok: #4ade80; --on-ok: #052e16; --ok-bg: #14532d; --ok-line: #22c55e;
      --hot: #fbbf24; --hot-bg: #78350f;
      --wait-bg: #713f12; --error-bg: #7f1d1d; --needed-bg: #422006;
      --unresolved: #f87171;
      --dim-fill: #26282e; --dim-line: #52525b; --dim-text: #d4d4d8;
      --edge-bg: #1c1f26; --edge-text: #e5e7eb;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1115; --fg: #e5e7eb; --muted: #a3a3a3; --line: #3f3f46; --field-bg: #1c1f26;
    --ok: #4ade80; --on-ok: #052e16; --ok-bg: #14532d; --ok-line: #22c55e;
    --hot: #fbbf24; --hot-bg: #78350f;
    --wait-bg: #713f12; --error-bg: #7f1d1d; --needed-bg: #422006;
    --unresolved: #f87171;
      --dim-fill: #26282e; --dim-line: #52525b; --dim-text: #d4d4d8;
      --edge-bg: #1c1f26; --edge-text: #e5e7eb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  header { padding: 8px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
  header h1 { font-size: 16px; margin: 0 auto 0 0; }
  main { display: grid; grid-template-columns: 340px 1fr; min-height: calc(100vh - 45px); }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  aside { border-right: 1px solid var(--line); padding: 12px 16px; overflow-y: auto; }
  h2 { font-size: 12px; text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; }
  .control { margin: 0 0 12px; }
  .control label { display: block; font-weight: 600; }
  .control small { display: block; color: var(--muted); }
  .control.set label::after { content: " (set)"; color: var(--ok); font-weight: 400; }
  .control.focus { outline: 2px solid var(--hot); outline-offset: 4px; }
  .control.needed input { border: 2px solid var(--hot); background: var(--needed-bg); }
  input[type=text], select { width: 100%; font: inherit; padding: 4px 6px; background: var(--field-bg); color: var(--fg); border: 1px solid var(--line); }
  button { font: inherit; margin: 2px 4px 2px 0; }
  button[aria-pressed=true] { background: var(--ok); color: var(--on-ok); border-color: var(--ok); }
  #step { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  #step .kind { font-weight: 700; text-transform: uppercase; font-size: 12px; }
  #step.done { background: var(--ok-bg); }
  #step.question, #step.request { background: var(--wait-bg); }
  #step.error { background: var(--error-bg); }
  #step pre { white-space: pre-wrap; font: inherit; margin: 4px 0; }
  .trace { color: var(--muted); }
  .legend { padding: 0 16px; }
  .legend span { margin-right: 12px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border: 2px solid; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
  .legend .taken { background: var(--ok-bg); border-color: var(--ok-line); }
  .legend .current { background: var(--hot-bg); border-color: var(--hot); }
  .legend .dimmed { border-color: var(--muted); opacity: 0.4; }
  section { display: flex; flex-direction: column; min-width: 0; }
  .zoom { padding: 4px 16px; display: flex; gap: 4px; align-items: center; }
  #diagram { flex: 1; min-height: 60vh; overflow: auto; cursor: grab; }
  #diagram.dragging { cursor: grabbing; user-select: none; }
  #diagram svg { display: block; max-width: none; }
  #diagram .question-node { cursor: pointer; }
  /* Mermaid draws taken and current nodes with light fills. Their text stays dark in both themes. */
  #diagram .taken *, #diagram .current * { color: #111 !important; }
  #diagram .unresolved * { color: var(--unresolved) !important; }
  /* Dimmed nodes: a muted fill and border, and full-strength text that passes 4.5:1 on the fill. */
  #diagram .dimmed .label-container { fill: var(--dim-fill) !important; stroke: var(--dim-line) !important; opacity: 1 !important; }
  /* Mermaid's own SVG style sets opacity 0.4 on dimmed labels. The :not(#_) adds an id's weight to win over it. */
  #diagram svg:not(#_) .dimmed > *, #diagram svg:not(#_) .dimmed span { opacity: 1 !important; }
  #diagram .dimmed span, #diagram .dimmed p { color: var(--dim-text) !important; }
  /* Edge labels: a solid background, so the text passes 4.5:1 in both themes. */
  #diagram .edgeLabel, #diagram .edgeLabel p, #diagram .edgeLabel rect, #diagram .labelBkg { background-color: var(--edge-bg) !important; fill: var(--edge-bg) !important; opacity: 1 !important; }
  #diagram .edgeLabel span, #diagram .edgeLabel p { color: var(--edge-text) !important; }
  #theme { width: auto; }
</style>
</head>
<body>
<header><h1>rein debug</h1><label>Entry <select id="entry"></select></label><label>Theme <select id="theme"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select></label><button id="back" type="button">Back</button><button id="reset" type="button">Reset</button><button id="copy" type="button">Copy link</button></header>
<main>
<aside id="controls" aria-label="Inputs and answers"></aside>
<section>
<div id="step" aria-live="polite"></div>
<p class="legend"><span><i class="taken"></i>taken</span><span><i class="current"></i>current</span><span><i class="dimmed"></i>not taken</span></p>
<div class="zoom" role="toolbar" aria-label="Diagram zoom"><button id="zoom-out" type="button" aria-label="Zoom out">&minus;</button><button id="zoom-in" type="button" aria-label="Zoom in">+</button><button id="zoom-fit" type="button">Fit</button><button id="zoom-100" type="button">100%</button><span id="zoom-level" class="trace"></span></div>
<div id="diagram"></div>
</section>
</main>
<script type="module">
import mermaid from "__MERMAID__";
const initial = __INITIAL__;
const state = { entry: initial.entry, inputs: {}, answers: {}, order: [], placeholders: [] };
let schema = { functions: [], inputs: {}, answers: [] };
let renders = 0;
let pending = 0;
let lastDiagram = null;
const $ = (id) => document.getElementById(id);

// The query string holds the whole state: `entry`, `in.<name>` per input, `a.<key>` per answer. A link that
// carries any of them wins over the starting values; otherwise the starting values are the state.
function readUrl(start) {
  const q = new URLSearchParams(location.search);
  const keys = [...q.keys()];
  if (!keys.some((k) => k === "entry" || k.startsWith("in.") || k.startsWith("a."))) {
    Object.assign(state, { entry: start.entry, inputs: { ...start.inputs }, answers: { ...start.answers } });
  } else {
    state.entry = q.get("entry") || start.entry;
    for (const [k, v] of q) {
      if (v && k.startsWith("in.")) state.inputs[k.slice(3)] = v;
      else if (v && k.startsWith("a.")) state.answers[k.slice(2)] = v;
    }
  }
  state.order = Object.keys(state.answers);
}

// Every change writes the whole state to the URL with replaceState, so the address is always a shareable link.
// It replaces rather than pushes: each keystroke would otherwise fill the Back history. Back still undoes answers.
function writeUrl() {
  const q = new URLSearchParams();
  if (state.entry) q.set("entry", state.entry);
  for (const [k, v] of Object.entries(state.inputs)) if (v) q.set("in." + k, v);
  for (const k of state.order) if (state.answers[k]) q.set("a." + k, state.answers[k]);
  history.replaceState(null, "", "?" + q);
}

readUrl(initial);

// Auto follows the OS. Light and Dark set data-theme, and the choice is kept in localStorage if the browser allows.
const osDark = matchMedia("(prefers-color-scheme: dark)");
function savedTheme() {
  try { const t = localStorage.getItem("rein-theme"); return ["light", "dark"].includes(t) ? t : "auto"; } catch (e) { return "auto"; }
}
function applyTheme(choice) {
  document.documentElement.dataset.theme = choice;
  const dark = choice === "dark" || (choice === "auto" && osDark.matches);
  mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: dark ? "dark" : "default" });
  if (lastDiagram) drawDiagram(lastDiagram.text, lastDiagram.keys);
}
osDark.addEventListener("change", () => { if (savedTheme() === "auto") applyTheme("auto"); });

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  e.append(...kids);
  return e;
}

// An empty value unsets the key.
function setAnswer(key, value) {
  state.order = state.order.filter((k) => k !== key);
  if (!value) delete state.answers[key];
  else { state.answers[key] = value; state.order.push(key); }
  walk();
}

function setInput(name, value) {
  if (!value) delete state.inputs[name];
  else state.inputs[name] = value;
  walk();
}

// One control per key: yes/no buttons, a list of the options, or a text box.
function control(item, value, onChange) {
  const id = "c-" + item.key;
  let field;
  if (item.type === "boolean") {
    field = el("span", {}, ...["yes", "no"].map((v) =>
      el("button", { type: "button", "aria-pressed": String(value === v), onclick: () => onChange(value === v ? "" : v) }, v)));
  } else if (item.type === "union") {
    field = el("select", { id, onchange: (e) => onChange(e.target.value) },
      el("option", { value: "" }, "(unset)"), ...item.options.map((o) => el("option", { value: o }, o)));
    field.value = value ?? "";
  } else {
    const placeholder = item.fields ? "{" + item.fields.map((f) => `"${f}": ...`).join(", ") + "}" : "(unset)";
    field = el("input", { id, type: "text", placeholder, onchange: (e) => onChange(e.target.value.trim()) });
    field.value = value ?? "";
  }
  const kind = item.type === "string" || item.type === "struct" ? ` (${item.type})` : "";
  return el("div", { class: "control" + (value ? " set" : ""), "data-key": item.key },
    el("label", { for: id }, item.key), el("small", {}, item.description + kind), field);
}

function drawControls() {
  const box = $("controls");
  box.replaceChildren();
  const inputs = schema.inputs[state.entry] || [];
  if (inputs.length) box.append(el("h2", {}, "Inputs"));
  for (const i of inputs) {
    const unset = state.placeholders.includes(i.name);
    const note = unset ? " (unset: the process shows <" + i.name + ">)" : "";
    const c = control({ key: i.name, type: "string", description: i.description + note }, state.inputs[i.name], (v) => setInput(i.name, v));
    if (unset) c.classList.add("needed");
    box.append(c);
  }
  box.append(el("h2", {}, "Answers"));
  for (const a of schema.answers) box.append(control(a, state.answers[a.key], (v) => setAnswer(a.key, v)));
}

function focusKey(key) {
  const c = document.querySelector(`.control[data-key="${CSS.escape(key)}"]`);
  if (!c) return;
  document.querySelectorAll(".control.focus").forEach((e) => e.classList.remove("focus"));
  c.classList.add("focus");
  c.scrollIntoView({ block: "center" });
  c.querySelector("select, input, button")?.focus();
}

// Buttons or a text box that answer the current question or request.
function answerBox(item) {
  if (item.type === "boolean") return el("div", {}, ...["yes", "no"].map((v) => el("button", { type: "button", onclick: () => setAnswer(item.key, v) }, v)));
  if (item.type === "union") return el("div", {}, ...item.options.map((o) => el("button", { type: "button", onclick: () => setAnswer(item.key, o) }, o)));
  const input = el("input", { type: "text", "aria-label": item.key, placeholder: item.key });
  return el("form", { onsubmit: (e) => { e.preventDefault(); setAnswer(item.key, input.value.trim()); } }, input, el("button", {}, "Answer"));
}

// The current step: the question, the request, the final instruction, or the error.
function drawStep(step) {
  const box = $("step");
  box.className = step.kind;
  const parts = [el("div", { class: "kind" }, step.kind + (step.key ? " " + step.key : ""))];
  const known = schema.answers.find((a) => a.key === step.key);
  if (step.kind === "question") {
    parts.push(el("pre", {}, step.description), answerBox(known || { key: step.key, type: step.type, options: step.options }));
  } else if (step.kind === "request") {
    const r = step.response;
    parts.push(el("pre", {}, step.instruction), el("div", {}, "Then answer: " + r.description),
      answerBox(known || { key: step.key, type: r.type, options: r.options }));
  } else if (step.kind === "done") {
    parts.push(el("pre", {}, step.instruction));
  } else {
    parts.push(el("pre", {}, step.message), ...(step.diagnostics || []).map((d) => el("div", {}, `${d.file}:${d.line}:${d.column}: ${d.message}`)));
  }
  if (step.trace && step.trace.length) parts.push(el("div", { class: "trace" }, "trace: " + step.trace.join(" -> ")));
  const unset = state.placeholders;
  if (unset.length) parts.push(el("div", { class: "trace" }, "input needed: " + unset.join(", ") + " (shown as " + unset.map((p) => "<" + p + ">").join(", ") + ")"));
  box.replaceChildren(...parts);
}

// The diagram is drawn at its natural size (zoom 1 = one px per SVG unit). The box scrolls and pans.
const view = { zoom: 1 };
function sizeDiagram() {
  const svg = $("diagram").querySelector("svg");
  if (!svg) return;
  const vb = svg.viewBox.baseVal;
  svg.removeAttribute("style");
  svg.setAttribute("width", vb.width * view.zoom);
  svg.setAttribute("height", vb.height * view.zoom);
  $("zoom-level").textContent = Math.round(view.zoom * 100) + "%";
}
// Changes the zoom and keeps the point at the middle of the box in the middle.
function setZoom(z) {
  const box = $("diagram");
  const cx = (box.scrollLeft + box.clientWidth / 2) / view.zoom;
  const cy = (box.scrollTop + box.clientHeight / 2) / view.zoom;
  view.zoom = Math.min(4, Math.max(0.1, z));
  sizeDiagram();
  box.scrollLeft = cx * view.zoom - box.clientWidth / 2;
  box.scrollTop = cy * view.zoom - box.clientHeight / 2;
}
// Zoom 100% with the current node in the middle of the box. Without a current node, the top left.
function centerCurrent() {
  const box = $("diagram");
  setZoom(1);
  const node = box.querySelector("g.node.current");
  if (!node) return box.scrollTo(0, 0);
  const r = node.getBoundingClientRect(), b = box.getBoundingClientRect();
  box.scrollLeft += r.left + r.width / 2 - (b.left + box.clientWidth / 2);
  box.scrollTop += r.top + r.height / 2 - (b.top + box.clientHeight / 2);
}

async function drawDiagram(text, keys) {
  lastDiagram = { text, keys };
  const { svg } = await mermaid.render("flow" + renders++, text);
  const box = $("diagram");
  box.innerHTML = svg;
  sizeDiagram();
  for (const g of box.querySelectorAll("g.node")) {
    const m = g.id.match(/^flowchart-(.+)-\d+$/);
    const key = m && keys[m[1]];
    if (key) { g.classList.add("question-node"); g.addEventListener("click", () => focusKey(key)); }
  }
}

async function walk() {
  const ticket = ++pending;
  writeUrl();
  const body = JSON.stringify({ entry: state.entry, inputs: state.inputs, answers: state.answers });
  const out = await (await fetch("/walk", { method: "POST", headers: { "Content-Type": "application/json" }, body })).json();
  if (ticket !== pending) return;
  state.placeholders = out.placeholders || [];
  drawControls();
  drawStep(out.step);
  await drawDiagram(out.mermaid, out.keys);
  centerCurrent();
  document.body.dataset.renders = String(renders);
}

$("back").addEventListener("click", () => { const key = state.order.at(-1); if (key) setAnswer(key, ""); });
$("reset").addEventListener("click", () => { state.inputs = { ...initial.inputs }; state.answers = {}; state.order = []; walk(); });
// Copy the address of this page, which holds the state. The fallback selects the link in a field for a manual copy.
$("copy").addEventListener("click", async () => {
  const link = location.href;
  try {
    await navigator.clipboard.writeText(link);
    $("copy").textContent = "Copied";
    setTimeout(() => { $("copy").textContent = "Copy link"; }, 1500);
  } catch {
    const box = el("textarea", {}, link);
    document.body.append(box);
    box.select();
    if (!document.execCommand("copy")) window.prompt("Copy this link:", link);
    box.remove();
  }
});
schema = await (await fetch("/schema")).json();
const pick = $("entry");
pick.append(...schema.functions.map((f) => el("option", { value: f }, f)));
pick.value = state.entry;
pick.addEventListener("change", () => { state.entry = pick.value; state.inputs = {}; walk(); });
const theme = $("theme");
theme.value = savedTheme();
theme.addEventListener("change", () => {
  try { localStorage.setItem("rein-theme", theme.value); } catch (e) {}
  applyTheme(theme.value);
});
applyTheme(theme.value);
$("zoom-in").addEventListener("click", () => setZoom(view.zoom * 1.25));
$("zoom-out").addEventListener("click", () => setZoom(view.zoom / 1.25));
$("zoom-100").addEventListener("click", centerCurrent);
$("zoom-fit").addEventListener("click", () => {
  const box = $("diagram"), vb = box.querySelector("svg")?.viewBox.baseVal;
  if (!vb) return;
  setZoom(Math.min(box.clientWidth / vb.width, box.clientHeight / vb.height));
  box.scrollTo(0, 0);
});
// Ctrl or Cmd with the wheel zooms. A plain wheel scrolls.
$("diagram").addEventListener("wheel", (e) => {
  if (!e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  setZoom(view.zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1));
}, { passive: false });
// Drag to pan. A drag does not count as a click on a node.
const box = $("diagram");
let drag = null, dragged = false;
box.addEventListener("pointerdown", (e) => {
  if (e.button !== 0) return;
  drag = { x: e.clientX, y: e.clientY, left: box.scrollLeft, top: box.scrollTop };
  dragged = false;
});
box.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!dragged && Math.hypot(dx, dy) > 4) { dragged = true; box.classList.add("dragging"); box.setPointerCapture(e.pointerId); }
  if (dragged) { box.scrollLeft = drag.left - dx; box.scrollTop = drag.top - dy; }
});
box.addEventListener("pointerup", () => { drag = null; box.classList.remove("dragging"); });
box.addEventListener("click", (e) => { if (dragged) { e.stopPropagation(); e.preventDefault(); } }, true);
walk();
</script>
</body>
</html>
