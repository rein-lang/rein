<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  /* Colors are tokens. The OS picks the dark set. */
  :root {
    color-scheme: light;
    --bg: #fff; --fg: #111; --muted: #666; --line: #ddd;
    --ok-bg: #dcfce7; --ok-line: #16a34a; --hot-bg: #fde68a; --hot: #d97706;
    --unresolved: #c00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #0f1115; --fg: #e5e7eb; --muted: #a3a3a3; --line: #3f3f46;
      --ok-bg: #14532d; --ok-line: #22c55e; --hot-bg: #78350f; --hot: #fbbf24;
      --unresolved: #f87171;
    }
  }
  body { margin: 0; padding: 16px; font: 14px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  h1 { font-size: 18px; margin: 0 0 8px; }
  .legend span { display: inline-block; margin-right: 16px; }
  .legend i { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -1px; border: 2px solid; border-radius: 3px; }
  .legend .taken { background: var(--ok-bg); border-color: var(--ok-line); }
  .legend .current { background: var(--hot-bg); border-color: var(--hot); }
  .legend .dimmed { background: var(--bg); border-color: var(--muted); opacity: 0.4; }
  pre.mermaid { overflow-x: auto; }
  /* Mermaid draws taken and current nodes with light fills. Their text stays dark in both themes. */
  pre.mermaid .taken *, pre.mermaid .current * { color: #111 !important; }
  pre.mermaid .unresolved * { color: var(--unresolved) !important; }
</style>
</head>
<body>
<h1>__TITLE__</h1>
__WALK__<pre class="mermaid">
__DIAGRAM__</pre>
<script type="module">
  import mermaid from "__MERMAID__";
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  mermaid.initialize({ startOnLoad: true, securityLevel: "strict", theme: dark ? "dark" : "default" });
</script>
</body>
</html>
