[workspace]
resolver = "2"
members = ["crates/rein-core", "crates/rein"]

[workspace.package]
version = "0.1.6"
edition = "2021"
license = "MIT"
repository = "https://github.com/rein-lang/rein"
homepage = "https://rein-lang.com"

[workspace.lints.clippy]
redundant_clone = "deny"
# Prefer `let PATTERN = expr else { diverge };` over a `match` whose only other arm
# diverges (return/continue/break). The happy path stays unindented.
manual_let_else = "deny"
